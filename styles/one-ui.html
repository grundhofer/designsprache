<style>
.style-one-ui { --ground:#F3F3F5; --ink:#17171B; --blue:#2158C9;
  box-sizing:border-box; min-height:460px; padding:28px; background:var(--ground); color:var(--ink);
  color-scheme:light; font:16px/1.45 "Roboto",Arial,sans-serif; }
.style-one-ui * { box-sizing:border-box; }
.style-one-ui .workspace { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:430px; gap:24px; }
.style-one-ui .viewing { display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding:26px 12px; }
.style-one-ui .eyebrow { font-size:13px; color:#55555E; margin:0 0 20px; }
.style-one-ui h2 { margin:0; font-size:38px; line-height:1.2; letter-spacing:-.035em; font-weight:700; }
.style-one-ui .count { margin-top:8px; color:#55555E; font-size:20px; font-weight:400; }
.style-one-ui .view-rule { width:32px; height:4px; border-radius:999px; background:#D0D0D6; margin-top:30px; }
.style-one-ui .interaction { display:flex; flex-direction:column; gap:16px; padding-block:8px; }
.style-one-ui ul { padding:0 20px; margin:0; list-style:none; border-radius:24px; background:#FFFFFF; }
.style-one-ui li { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center;
  gap:4px 12px; min-height:84px; padding:16px 0; border-bottom:1px solid #E7E7EB; }
.style-one-ui li:last-child { border-bottom:0; }
.style-one-ui .name { font-size:18px; font-weight:500; }
.style-one-ui .time { grid-column:1; font-size:14px; color:#55555E; }
.style-one-ui .status { grid-column:2; grid-row:1 / 3; font-size:14px; color:#2158C9; }
.style-one-ui .paused { color:#55555E; }
.style-one-ui input { width:100%; min-height:48px; padding:12px 20px; background:#E7E7EB; color:var(--ink);
  border:0; border-radius:999px; font:inherit; }
.style-one-ui input::placeholder { color:#55555E; opacity:1; }
.style-one-ui .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:auto; }
.style-one-ui button { flex:1 1 auto; min-height:48px; padding:12px 20px; border:0; border-radius:999px;
  font:600 15px/1.4 "Roboto",Arial,sans-serif; background:#E7E7EB; color:var(--ink); }
.style-one-ui .primary { background:var(--blue); color:#FFFFFF; }
.style-one-ui .caption { margin:18px 0 0; font-size:12px; color:#55555E; text-align:center; }
</style>
<div class="style-one-ui">
  <div class="workspace">
    <div class="viewing"><p class="eyebrow">Dein Arbeitsbereich</p><h2>Projekte</h2><span class="count">12</span><span class="view-rule" aria-hidden="true"></span></div>
    <div class="interaction">
      <ul>
        <li><span class="name">Nexus</span><span class="time">vor 2 Std.</span><span class="status">Aktiv</span></li>
        <li><span class="name">Autowrite Studio</span><span class="time">gestern</span><span class="status">Aktiv</span></li>
        <li><span class="name">Balance Ally</span><span class="time">vor 4 Tagen</span><span class="status paused">Pausiert</span></li>
      </ul>
      <input type="search" readonly placeholder="Suchen…" aria-label="Projekte durchsuchen">
      <div class="actions"><button type="button" class="primary">Neues Projekt</button><button type="button">Importieren</button></div>
    </div>
  </div>
  <p class="caption">Betrachtungsbereich links · Interaktionsbereich rechts · eigene breite Adaption</p>
</div>
