<style>
.style-retro-futurism {
  color-scheme: dark;
  --rf-void: #08070a;
  --rf-hull: #14120c;
  --rf-panel: #1b1710;
  --rf-amber: #ffb000;
  --rf-amber-dim: #a86f00;
  --rf-phos: #57e06a;
  --rf-hazard: #e8b400;
  --rf-ink: #f3d9a4;
  --rf-chamfer: 20px;

  width: 100%;
  box-sizing: border-box;
  container-type: inline-size;
  color: var(--rf-ink);
  font-family: "Share Tech Mono", ui-monospace, "Courier New", monospace;
  line-height: 1.45;
  font-size: 15px;
  background:
    radial-gradient(120% 90% at 50% 40%, #191510 0%, #0d0b08 58%, #050405 100%);
}

.style-retro-futurism * {
  box-sizing: border-box;
}

.style-retro-futurism .demo {
  position: relative;
  overflow: hidden;
  min-height: 460px;
  padding: 30px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
}

/* ---------- Konsolen-Gehaeuse mit abgeschraegten Ecken ---------- */

.style-retro-futurism .console {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 540px;
  padding: 2px;
  background: linear-gradient(180deg, #6b5a34 0%, #352d1a 40%, #241e12 100%);
  clip-path: polygon(
    var(--rf-chamfer) 0,
    100% 0,
    100% calc(100% - var(--rf-chamfer)),
    calc(100% - var(--rf-chamfer)) 100%,
    0 100%,
    0 var(--rf-chamfer)
  );
  filter: drop-shadow(0 0 26px rgba(255, 176, 0, 0.13));
}

.style-retro-futurism .hull {
  background: var(--rf-hull);
  clip-path: polygon(
    calc(var(--rf-chamfer) - 2px) 0,
    100% 0,
    100% calc(100% - var(--rf-chamfer) + 2px),
    calc(100% - var(--rf-chamfer) + 2px) 100%,
    0 100%,
    0 calc(var(--rf-chamfer) - 2px)
  );
  padding: 10px;
}

/* ---------- Technische Beschriftung ---------- */

.style-retro-futurism .rail {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 4px 9px;
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--rf-amber-dim);
}

.style-retro-futurism .rail .spacer { flex: 1; }

.style-retro-futurism .rail .tag {
  border: 1px solid rgba(168, 111, 0, 0.6);
  padding: 1px 6px;
  color: #c99320;
}

.style-retro-futurism .rail .led {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rf-phos);
  box-shadow: 0 0 8px rgba(87, 224, 106, 0.9);
  animation: retro-futurism-blink 2.4s steps(1, end) infinite;
}

@keyframes retro-futurism-blink {
  0%, 62%  { opacity: 1; }
  63%, 100% { opacity: 0.22; }
}

/* ---------- Bildschirm ---------- */

.style-retro-futurism .screen {
  position: relative;
  padding: 19px 19px 21px;
  background:
    repeating-linear-gradient(0deg, rgba(255, 176, 0, 0.045) 0 1px, rgba(255, 176, 0, 0) 1px 26px),
    repeating-linear-gradient(90deg, rgba(255, 176, 0, 0.045) 0 1px, rgba(255, 176, 0, 0) 1px 26px),
    radial-gradient(120% 100% at 50% 0%, #221c12 0%, #14110b 60%, #0d0b07 100%);
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.9), inset 0 1px 6px rgba(0, 0, 0, 0.95), inset 0 0 14px rgba(255, 176, 0, 0.10);
}

/* Ecken-Klammern: tragen den Rahmen allein, es gibt keine durchgezogene Kante */
.style-retro-futurism .screen::before,
.style-retro-futurism .screen::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  border-color: var(--rf-amber);
  filter: drop-shadow(0 0 5px rgba(255, 176, 0, 0.6));
  pointer-events: none;
}

.style-retro-futurism .screen::before {
  top: 5px;
  right: 5px;
  border-top: 2px solid;
  border-right: 2px solid;
}

.style-retro-futurism .screen::after {
  bottom: 5px;
  left: 5px;
  border-bottom: 2px solid;
  border-left: 2px solid;
}

/* ---------- Header + Zaehler ---------- */

.style-retro-futurism .head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 2px solid rgba(255, 176, 0, 0.4);
}

.style-retro-futurism .head h2 {
  margin: 0;
  flex: 1;
  font-family: Michroma, "Share Tech Mono", ui-monospace, monospace;
  font-weight: 400;
  font-size: 21px;
  line-height: 1.1;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--rf-amber);
  text-shadow: 0 0 12px rgba(255, 176, 0, 0.55), 0 0 34px rgba(255, 140, 0, 0.28);
}

.style-retro-futurism .count {
  font-family: Michroma, "Share Tech Mono", ui-monospace, monospace;
  font-size: 20px;
  line-height: 1;
  padding: 9px 13px 8px;
  color: var(--rf-phos);
  background: #0a1409;
  border: 1px solid rgba(87, 224, 106, 0.55);
  border-radius: 3px;
  text-shadow: 0 0 12px rgba(87, 224, 106, 0.85);
  box-shadow: inset 0 0 18px rgba(87, 224, 106, 0.14), 0 0 10px rgba(87, 224, 106, 0.18);
}

/* ---------- Liste: breite Kacheln mit angeschnittener Ecke ---------- */

.style-retro-futurism .list {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.style-retro-futurism .row {
  position: relative;
  display: grid;
  grid-template-columns: 34px 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 11px 14px 11px 0;
  color: var(--rf-ink);
  background: linear-gradient(90deg, rgba(255, 176, 0, 0.13) 0%, rgba(255, 176, 0, 0.045) 26%, rgba(255, 176, 0, 0.02) 100%);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  border-left: 4px solid var(--rf-amber);
  transition: background 180ms linear, border-left-color 180ms linear;
}

.style-retro-futurism .row.paused {
  border-left-color: var(--rf-amber-dim);
  background: linear-gradient(90deg, rgba(255, 176, 0, 0.07) 0%, rgba(255, 176, 0, 0.02) 40%, rgba(255, 176, 0, 0.01) 100%);
}

.style-retro-futurism .row:hover {
  background: linear-gradient(90deg, rgba(255, 176, 0, 0.24) 0%, rgba(255, 176, 0, 0.09) 40%, rgba(255, 176, 0, 0.03) 100%);
}

.style-retro-futurism .idx {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-align: center;
  color: var(--rf-amber-dim);
}

.style-retro-futurism .name {
  font-family: Michroma, "Share Tech Mono", ui-monospace, monospace;
  font-size: 12.5px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: #ffe6b4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.style-retro-futurism .time {
  font-size: 12.5px;
  letter-spacing: 0.06em;
  color: #c9a86a;
  white-space: nowrap;
}

.style-retro-futurism .status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 3px 10px;
  white-space: nowrap;
  border: 1px solid currentColor;
  border-radius: 2px;
}

.style-retro-futurism .status::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}

.style-retro-futurism .status.on { color: var(--rf-phos); }

.style-retro-futurism .status.off {
  color: #ffb000;
  border-style: dashed;
}

.style-retro-futurism .status.off::before {
  border-radius: 0;
  box-shadow: none;
}

/* ---------- Suchfeld ---------- */

.style-retro-futurism .search {
  position: relative;
  margin-bottom: 16px;
}

.style-retro-futurism .search .caret {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  color: var(--rf-amber);
  text-shadow: 0 0 10px rgba(255, 176, 0, 0.8);
  pointer-events: none;
  animation: retro-futurism-caret 1.1s steps(1, end) infinite;
}

@keyframes retro-futurism-caret {
  0%, 49%   { opacity: 1; }
  50%, 100% { opacity: 0.15; }
}

.style-retro-futurism .search input {
  width: 100%;
  height: 42px;
  padding: 0 14px 0 32px;
  font-family: inherit;
  font-size: 14.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #ffdd9e;
  background: #0c0a06;
  border: 1px solid rgba(255, 176, 0, 0.45);
  border-radius: 2px;
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 176, 0, 0.08);
  outline: none;
}

.style-retro-futurism .search input::placeholder {
  color: #b58a3e;
  opacity: 1;
}

.style-retro-futurism .search input:focus-visible {
  border-color: var(--rf-amber);
  box-shadow: 0 0 0 2px rgba(255, 176, 0, 0.6), inset 0 2px 10px rgba(0, 0, 0, 0.9);
}

/* ---------- Aktionen: 70er-Konsolentasten ---------- */

.style-retro-futurism .actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.style-retro-futurism button {
  font-family: Michroma, "Share Tech Mono", ui-monospace, monospace;
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  height: 46px;
  padding: 0 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 120ms ease-out, box-shadow 120ms ease-out, background 120ms linear;
}

.style-retro-futurism .primary {
  color: #241700;
  border: 1px solid #ffd77a;
  background: linear-gradient(180deg, #ffd066 0%, #ffb000 44%, #d98d00 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.6),
    inset 0 -3px 6px rgba(120, 70, 0, 0.5),
    0 4px 0 #7a4f00,
    0 0 24px rgba(255, 176, 0, 0.35);
}

.style-retro-futurism .secondary {
  color: #ffcf8a;
  border: 1px solid rgba(255, 176, 0, 0.6);
  background: linear-gradient(180deg, #2a2318 0%, #1a160f 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 214, 140, 0.22),
    0 4px 0 #0d0b07;
}

.style-retro-futurism button:hover { filter: brightness(1.1); }

.style-retro-futurism button:active {
  transform: translateY(3px);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
}

.style-retro-futurism button:focus-visible {
  outline: 2px solid var(--rf-phos);
  outline-offset: 3px;
}

/* ---------- Warnstreifen ---------- */

.style-retro-futurism .hazard {
  height: 10px;
  margin-top: 10px;
  background: repeating-linear-gradient(45deg, var(--rf-hazard) 0 9px, #171308 9px 18px);
  opacity: 0.85;
}

/* ---------- CRT-Overlay ---------- */

.style-retro-futurism .crt {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.30) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
    radial-gradient(115% 100% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.72) 100%);
}

.style-retro-futurism .sweep {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 176, 0, 0) 0%, rgba(255, 200, 90, 0.055) 48%, rgba(255, 176, 0, 0) 100%);
  animation: retro-futurism-sweep 6.5s linear infinite;
}

@keyframes retro-futurism-sweep {
  0%   { transform: translateY(-100%); }
  100% { transform: translateY(100%); }
}

@media (prefers-reduced-motion: reduce) {
  .style-retro-futurism .sweep { animation: none; opacity: 0.4; }
  .style-retro-futurism .rail .led,
  .style-retro-futurism .search .caret { animation: none; }
  .style-retro-futurism .row,
  .style-retro-futurism button { transition: none; }
}

/* Container-Query statt Media-Query: die breite Versalschrift braucht die
   echte Spaltenbreite als Bezug, nicht die Fensterbreite. */
@container (max-width: 560px) {
  .style-retro-futurism .demo { padding: 20px 12px; }
  .style-retro-futurism .hull { padding: 8px; }
  .style-retro-futurism .screen { padding: 14px 12px 16px; }
  .style-retro-futurism .head h2 { font-size: 16px; }
  .style-retro-futurism .count { font-size: 17px; padding: 7px 10px 6px; }
  .style-retro-futurism .name { font-size: 11px; }
  .style-retro-futurism .row {
    grid-template-columns: 26px 1fr auto;
    grid-template-areas: "idx name status" "idx time time";
    row-gap: 3px;
    padding-right: 10px;
  }
  .style-retro-futurism .idx { grid-area: idx; align-self: start; }
  .style-retro-futurism .name { grid-area: name; }
  .style-retro-futurism .time { grid-area: time; }
  .style-retro-futurism .status { grid-area: status; }
  .style-retro-futurism .actions { flex-direction: column; align-items: stretch; }
  .style-retro-futurism button { width: 100%; }
}
</style>
<div class="style-retro-futurism">
  <div class="demo">
    <div class="console">
      <div class="hull">
        <div class="rail">
          <span class="led"></span>
          <span>SYS 04</span>
          <span class="spacer"></span>
          <span class="tag">CH-7</span>
          <span class="tag">REC 0032</span>
        </div>

        <div class="screen">
          <div class="head">
            <h2>Projects</h2>
            <span class="count">12</span>
          </div>

          <ul class="list">
            <li class="row">
              <span class="idx" aria-hidden="true">01</span>
              <span class="name">Nexus</span>
              <span class="time">2 hrs ago</span>
              <span class="status on">Active</span>
            </li>
            <li class="row">
              <span class="idx" aria-hidden="true">02</span>
              <span class="name">Autowrite Studio</span>
              <span class="time">yesterday</span>
              <span class="status on">Active</span>
            </li>
            <li class="row paused">
              <span class="idx" aria-hidden="true">03</span>
              <span class="name">Balance Ally</span>
              <span class="time">4 days ago</span>
              <span class="status off">Paused</span>
            </li>
          </ul>

          <div class="search">
            <span class="caret" aria-hidden="true">&#9646;</span>
            <input type="text" readonly placeholder="Search...">
          </div>

          <div class="actions">
            <button class="primary" type="button">New project</button>
            <button class="secondary" type="button">Import</button>
          </div>
        </div>

        <div class="hazard"></div>
      </div>
    </div>

    <div class="crt"></div>
    <div class="sweep"></div>
  </div>
</div>
