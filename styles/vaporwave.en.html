<style>
.style-vaporwave {
  color-scheme: dark;
  --vw-void: #0b0121;
  --vw-deep: #1b0140;
  --vw-cyan: #01cdfe;
  --vw-magenta: #ff71ce;
  --vw-violet: #b967ff;
  --vw-amber: #ffb14e;
  --vw-ink: #e8dcff;

  width: 100%;
  box-sizing: border-box;
  container-type: inline-size;
  color: var(--vw-ink);
  font-family: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
  line-height: 1.5;
  font-size: 15px;
  background:
    radial-gradient(70% 46% at 50% 62%, rgba(185, 103, 255, 0.36) 0%, rgba(185, 103, 255, 0) 70%),
    linear-gradient(180deg, #05000f 0%, #12002e 34%, #2a0350 56%, #4a0a52 72%, #150130 86%, #06000f 100%);
}

.style-vaporwave * {
  box-sizing: border-box;
}

.style-vaporwave .demo {
  position: relative;
  overflow: hidden;
  min-height: 460px;
  padding: 34px 26px 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
}

/* ---------- Sternenfeld ---------- */

.style-vaporwave .stars {
  position: absolute;
  inset: 0 0 46% 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 12% 18%, #ffffff 0 1px, transparent 1.6px),
    radial-gradient(circle at 27% 8%,  #d8b9ff 0 1px, transparent 1.6px),
    radial-gradient(circle at 41% 26%, #ffffff 0 0.8px, transparent 1.4px),
    radial-gradient(circle at 63% 12%, #9fe9ff 0 1px, transparent 1.6px),
    radial-gradient(circle at 78% 30%, #ffffff 0 0.8px, transparent 1.4px),
    radial-gradient(circle at 88% 8%,  #ffb9ee 0 1px, transparent 1.6px),
    radial-gradient(circle at 6% 40%,  #ffffff 0 0.8px, transparent 1.4px),
    radial-gradient(circle at 53% 4%,  #ffffff 0 0.8px, transparent 1.4px),
    radial-gradient(circle at 94% 22%, #9fe9ff 0 0.8px, transparent 1.4px);
  opacity: 0.85;
}

/* ---------- Geschnittene Sonne ---------- */

.style-vaporwave .sun {
  position: absolute;
  z-index: 0;
  left: 50%;
  bottom: 46%;
  width: min(580px, 94%);
  height: 250px;
  transform: translateX(-50%);
  border-radius: 50%;
  pointer-events: none;
  background:
    linear-gradient(180deg, #fff2a8 0%, #ffc75e 26%, #ff7ab0 58%, #f3418f 78%, #b2189a 100%);
  -webkit-mask-image:
    linear-gradient(180deg,
      #000 0 54%,
      #000 54% 57%, transparent 57% 60%,
      #000 60% 63.5%, transparent 63.5% 67%,
      #000 67% 70%, transparent 70% 74%,
      #000 74% 76.5%, transparent 76.5% 81%,
      #000 81% 83%, transparent 83% 88%,
      #000 88% 89.5%, transparent 89.5% 100%);
  mask-image:
    linear-gradient(180deg,
      #000 0 54%,
      #000 54% 57%, transparent 57% 60%,
      #000 60% 63.5%, transparent 63.5% 67%,
      #000 67% 70%, transparent 70% 74%,
      #000 74% 76.5%, transparent 76.5% 81%,
      #000 81% 83%, transparent 83% 88%,
      #000 88% 89.5%, transparent 89.5% 100%);
  filter: drop-shadow(0 0 60px rgba(255, 96, 172, 0.7)) drop-shadow(0 0 120px rgba(255, 150, 60, 0.35));
}

/* ---------- Perspektivgitter mit Fluchtpunkt ---------- */

.style-vaporwave .floor {
  position: absolute;
  z-index: 0;
  left: -60%;
  right: -60%;
  bottom: -6px;
  height: 54%;
  pointer-events: none;
  transform: perspective(300px) rotateX(74deg);
  transform-origin: 50% 100%;
  background-image:
    repeating-linear-gradient(90deg, rgba(1, 205, 254, 0.85) 0 1.5px, rgba(1, 205, 254, 0) 1.5px 58px),
    repeating-linear-gradient(0deg, rgba(255, 113, 206, 0.8) 0 1.5px, rgba(255, 113, 206, 0) 1.5px 50px);
  -webkit-mask-image: linear-gradient(to top, #000 12%, rgba(0, 0, 0, 0.25) 72%, transparent 96%);
  mask-image: linear-gradient(to top, #000 12%, rgba(0, 0, 0, 0.25) 72%, transparent 96%);
  animation: vaporwave-scroll 3.6s linear infinite;
}

@keyframes vaporwave-scroll {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 0 0, 0 50px; }
}

/* Horizontglut */
.style-vaporwave .horizon {
  position: absolute;
  z-index: 0;
  left: 0;
  right: 0;
  bottom: 46%;
  height: 3px;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(1, 205, 254, 0) 0%, #01cdfe 22%, #ff71ce 50%, #01cdfe 78%, rgba(1, 205, 254, 0) 100%);
  box-shadow: 0 0 22px 5px rgba(255, 113, 206, 0.6), 0 0 60px 12px rgba(1, 205, 254, 0.35);
}

/* ---------- Katakana-Dekoration ---------- */

.style-vaporwave .kana {
  position: absolute;
  z-index: 1;
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  font-weight: 700;
  writing-mode: vertical-rl;
  letter-spacing: 0.22em;
  pointer-events: none;
  user-select: none;
}

.style-vaporwave .kana.left {
  left: 14px;
  top: 34px;
  font-size: 21px;
  color: rgba(1, 205, 254, 0.9);
  text-shadow: 0 0 12px rgba(1, 205, 254, 0.8), 2px 0 0 rgba(255, 113, 206, 0.45);
}

.style-vaporwave .kana.right {
  right: 14px;
  bottom: 34px;
  font-size: 15px;
  color: rgba(255, 113, 206, 0.75);
  text-shadow: 0 0 10px rgba(255, 113, 206, 0.7);
}

/* ---------- Panel ---------- */

.style-vaporwave .panel {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 520px;
  padding: 22px 22px 24px;
  background:
    linear-gradient(180deg, rgba(16, 2, 40, 0.93) 0%, rgba(8, 1, 24, 0.95) 100%);
  border: 1.5px solid rgba(1, 205, 254, 0.75);
  border-radius: 4px;
  box-shadow:
    0 0 0 1px rgba(255, 113, 206, 0.28),
    0 0 26px rgba(1, 205, 254, 0.35),
    0 0 70px rgba(185, 103, 255, 0.3),
    inset 0 0 46px rgba(185, 103, 255, 0.16);
}

/* Corner-Brackets */
.style-vaporwave .panel::before,
.style-vaporwave .panel::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  pointer-events: none;
}

.style-vaporwave .panel::before {
  top: -6px;
  left: -6px;
  border-top: 2px solid var(--vw-magenta);
  border-left: 2px solid var(--vw-magenta);
  box-shadow: 0 0 10px rgba(255, 113, 206, 0.9);
}

.style-vaporwave .panel::after {
  bottom: -6px;
  right: -6px;
  border-bottom: 2px solid var(--vw-magenta);
  border-right: 2px solid var(--vw-magenta);
  box-shadow: 0 0 10px rgba(255, 113, 206, 0.9);
}

/* ---------- Header + Zaehler ---------- */

.style-vaporwave .head {
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding-bottom: 12px;
  margin-bottom: 16px;
  border-bottom: 1px solid rgba(1, 205, 254, 0.35);
}

.style-vaporwave .head h2 {
  margin: 0;
  flex: 1;
  font-family: Orbitron, "Chakra Petch", sans-serif;
  font-weight: 900;
  font-size: 30px;
  line-height: 1;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #eaf6ff;
  filter:
    drop-shadow(0 0 14px rgba(1, 205, 254, 0.85))
    drop-shadow(2px 0 0 rgba(255, 113, 206, 0.6))
    drop-shadow(-2px 0 0 rgba(1, 205, 254, 0.5));
}

@supports (background-clip: text) or (-webkit-background-clip: text) {
  .style-vaporwave .head h2 {
    background: linear-gradient(180deg,
      #ffffff 0%, #d8f2ff 22%, #7fa8d6 44%,
      #2b3f6e 50%, #a7e2ff 50%, #ffffff 74%, #8fb6dd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
}

.style-vaporwave .count {
  font-family: Orbitron, "Chakra Petch", sans-serif;
  font-weight: 700;
  font-size: 22px;
  line-height: 1;
  padding: 7px 12px 6px;
  color: #b6f5ff;
  border: 1.5px solid rgba(1, 205, 254, 0.8);
  border-radius: 2px;
  background: rgba(1, 205, 254, 0.09);
  text-shadow: 0 0 12px rgba(1, 205, 254, 0.95);
  box-shadow: 0 0 14px rgba(1, 205, 254, 0.35), inset 0 0 14px rgba(1, 205, 254, 0.16);
}

/* ---------- Liste ---------- */

.style-vaporwave .list {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.style-vaporwave .row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 10px 14px;
  border: 1px solid rgba(185, 103, 255, 0.32);
  border-left: 3px solid var(--vw-cyan);
  border-radius: 2px;
  background: linear-gradient(90deg, rgba(1, 205, 254, 0.10) 0%, rgba(185, 103, 255, 0.05) 60%, rgba(255, 113, 206, 0.06) 100%);
  transition: border-color 180ms ease-out, box-shadow 180ms ease-out, transform 180ms ease-out;
}

.style-vaporwave .row.paused {
  border-left-color: var(--vw-magenta);
}

.style-vaporwave .row:hover {
  transform: translateX(2px);
  border-color: rgba(255, 113, 206, 0.7);
  box-shadow: 0 0 18px rgba(255, 113, 206, 0.3), inset 0 0 20px rgba(1, 205, 254, 0.12);
}

.style-vaporwave .name {
  font-weight: 600;
  font-size: 15.5px;
  letter-spacing: 0.03em;
  color: #f4ecff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.style-vaporwave .time {
  font-family: "Share Tech Mono", ui-monospace, monospace;
  font-size: 12.5px;
  letter-spacing: 0.04em;
  color: #a99dd0;
  white-space: nowrap;
}

.style-vaporwave .status {
  font-family: "Share Tech Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 2px;
  white-space: nowrap;
}

.style-vaporwave .status.on {
  color: #061a20;
  background: linear-gradient(180deg, #7fe9ff 0%, #01cdfe 100%);
  box-shadow: 0 0 14px rgba(1, 205, 254, 0.75);
  font-weight: 700;
}

.style-vaporwave .status.off {
  color: #ffc8ec;
  border: 1px solid rgba(255, 113, 206, 0.7);
  background: rgba(255, 113, 206, 0.12);
  box-shadow: inset 0 0 12px rgba(255, 113, 206, 0.2);
}

/* ---------- Suchfeld ---------- */

.style-vaporwave .search {
  position: relative;
  margin-bottom: 18px;
}

.style-vaporwave .search .prompt {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: "Share Tech Mono", ui-monospace, monospace;
  font-size: 15px;
  color: var(--vw-magenta);
  text-shadow: 0 0 10px rgba(255, 113, 206, 0.9);
  pointer-events: none;
}

.style-vaporwave .search input {
  width: 100%;
  height: 42px;
  padding: 0 14px 0 32px;
  font-family: "Share Tech Mono", ui-monospace, monospace;
  font-size: 14.5px;
  letter-spacing: 0.06em;
  color: #d9f6ff;
  background: rgba(1, 205, 254, 0.06);
  border: 1px solid rgba(1, 205, 254, 0.55);
  border-radius: 2px;
  box-shadow: inset 0 0 18px rgba(1, 205, 254, 0.14);
  outline: none;
}

.style-vaporwave .search input::placeholder {
  color: #7fb9d4;
  opacity: 1;
}

.style-vaporwave .search input:focus-visible {
  border-color: var(--vw-magenta);
  box-shadow: 0 0 0 2px rgba(255, 113, 206, 0.55), inset 0 0 18px rgba(255, 113, 206, 0.2);
}

/* ---------- Aktionen ---------- */

.style-vaporwave .actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.style-vaporwave button {
  font-family: Orbitron, "Chakra Petch", sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  height: 44px;
  padding: 0 20px;
  border-radius: 2px;
  cursor: pointer;
  transition: box-shadow 200ms ease-out, transform 160ms ease-out, filter 200ms ease-out;
}

.style-vaporwave .primary {
  color: #1a0224;
  border: 1px solid #ffd0ef;
  background: linear-gradient(180deg, #ffd9f2 0%, #ff8fd8 38%, #e14fb1 39%, #ff71ce 100%);
  box-shadow:
    0 0 22px rgba(255, 113, 206, 0.7),
    0 0 48px rgba(185, 103, 255, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.85);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
}

.style-vaporwave .secondary {
  color: #9df3ff;
  border: 1.5px solid var(--vw-cyan);
  background: rgba(1, 205, 254, 0.07);
  box-shadow: 0 0 16px rgba(1, 205, 254, 0.4), inset 0 0 16px rgba(1, 205, 254, 0.12);
  text-shadow: 0 0 10px rgba(1, 205, 254, 0.8);
}

.style-vaporwave button:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
}

.style-vaporwave .primary:hover { box-shadow: 0 0 30px rgba(255, 113, 206, 0.95), 0 0 66px rgba(185, 103, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
.style-vaporwave .secondary:hover { box-shadow: 0 0 26px rgba(1, 205, 254, 0.7), inset 0 0 22px rgba(1, 205, 254, 0.22); }

.style-vaporwave button:active { transform: translateY(1px); }

.style-vaporwave button:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 3px;
}

/* ---------- Scanlines + VHS-Aberration ueber allem ---------- */

.style-vaporwave .scan {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.26) 0 1px, rgba(0, 0, 0, 0) 1px 3px);
  mix-blend-mode: multiply;
  opacity: 0.55;
}

.style-vaporwave .tracking {
  position: absolute;
  z-index: 6;
  left: 0;
  right: 0;
  height: 46px;
  top: -46px;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 113, 206, 0.10) 40%, rgba(1, 205, 254, 0.10) 60%, rgba(255, 255, 255, 0) 100%);
  animation: vaporwave-tracking 7s linear infinite;
}

@keyframes vaporwave-tracking {
  0%   { transform: translateY(0); opacity: 0; }
  6%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { transform: translateY(560px); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .style-vaporwave .floor,
  .style-vaporwave .tracking { animation: none; }
  .style-vaporwave .tracking { display: none; }
  .style-vaporwave .row,
  .style-vaporwave button { transition: none; }
}

/* Container-Query statt Media-Query: die Demo reagiert auf ihre eigene
   Spaltenbreite, nicht auf das Browserfenster. */
@container (max-width: 560px) {
  .style-vaporwave .demo { padding: 24px 14px 30px; }
  .style-vaporwave .kana.left { font-size: 15px; left: 4px; }
  .style-vaporwave .kana.right { display: none; }
  .style-vaporwave .head h2 { font-size: 23px; }
  .style-vaporwave .count { font-size: 18px; }
  .style-vaporwave .row {
    grid-template-columns: 1fr auto;
    grid-template-areas: "name status" "time time";
    row-gap: 2px;
  }
  .style-vaporwave .name { grid-area: name; }
  .style-vaporwave .time { grid-area: time; }
  .style-vaporwave .status { grid-area: status; }
  .style-vaporwave .actions { flex-direction: column; align-items: stretch; }
  .style-vaporwave button { width: 100%; }
}
</style>
<div class="style-vaporwave">
  <div class="demo">
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="floor"></div>
    <div class="horizon"></div>
    <div class="kana left" aria-hidden="true">アエステティック</div>
    <div class="kana right" aria-hidden="true">未来の記憶</div>

    <div class="panel">
      <div class="head">
        <h2>Projects</h2>
        <span class="count">12</span>
      </div>

      <ul class="list">
        <li class="row">
          <span class="name">Nexus</span>
          <span class="time">2 hrs ago</span>
          <span class="status on">Active</span>
        </li>
        <li class="row">
          <span class="name">Autowrite Studio</span>
          <span class="time">yesterday</span>
          <span class="status on">Active</span>
        </li>
        <li class="row paused">
          <span class="name">Balance Ally</span>
          <span class="time">4 days ago</span>
          <span class="status off">Paused</span>
        </li>
      </ul>

      <div class="search">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input type="text" readonly placeholder="Search...">
      </div>

      <div class="actions">
        <button class="primary" type="button">New project</button>
        <button class="secondary" type="button">Import</button>
      </div>
    </div>

    <div class="scan"></div>
    <div class="tracking"></div>
  </div>
</div>
