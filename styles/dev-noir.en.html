<style>
.style-dev-noir {
  color-scheme: dark;
  --dn-bg: #08080B;
  --dn-surface: #0D0E12;
  --dn-raised: #14151A;
  --dn-line: rgba(255, 255, 255, .07);
  --dn-line-strong: rgba(255, 255, 255, .11);
  --dn-line-control: rgba(255, 255, 255, .36);
  --dn-text: #EDEDEF;
  --dn-text-2: #A2A2AE;
  --dn-text-3: #71717F;
  --dn-accent: #7C86E8;
  --dn-accent-deep: #5E6AD2;
  --dn-green: #4CC38A;
  --dn-amber: #E3A455;
  --dn-ease: cubic-bezier(.2, 0, 0, 1);
  width: 100%;
  background: var(--dn-bg);
  color: var(--dn-text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.style-dev-noir,
.style-dev-noir *,
.style-dev-noir *::before,
.style-dev-noir *::after { box-sizing: border-box; }

.style-dev-noir .demo {
  position: relative;
  min-height: 460px;
  padding: 40px 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(620px 340px at 14% -12%, rgba(94, 106, 210, .22), transparent 68%),
    radial-gradient(520px 300px at 104% -4%, rgba(70, 160, 235, .10), transparent 62%),
    linear-gradient(180deg, #0A0A0F 0%, #08080B 60%);
}

.style-dev-noir .demo::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(80% 70% at 50% 0%, #000 0%, transparent 78%);
  mask-image: radial-gradient(80% 70% at 50% 0%, #000 0%, transparent 78%);
}

.style-dev-noir .demo::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .10;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.35'/></svg>");
}

.style-dev-noir .app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 680px;
  border: 1px solid var(--dn-line);
  border-radius: 10px;
  background: linear-gradient(180deg, #0F1015 0%, #0A0B0E 46%, #090A0D 100%);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, .6),
    0 1px 0 0 rgba(255, 255, 255, .05) inset,
    0 32px 90px -26px rgba(0, 0, 0, .95),
    0 0 90px -34px rgba(94, 106, 210, .75);
  overflow: hidden;
}

.style-dev-noir .titlebar {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 38px;
  padding: 0 11px 0 13px;
  border-bottom: 1px solid var(--dn-line);
  background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0));
}

.style-dev-noir .mark {
  display: block;
  width: 15px;
  height: 15px;
  flex: none;
  filter: drop-shadow(0 0 6px rgba(124, 134, 232, .55));
}

.style-dev-noir .crumb {
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  letter-spacing: .01em;
  color: var(--dn-text-3);
}

.style-dev-noir .crumb b {
  color: var(--dn-text-2);
  font-weight: 500;
}

.style-dev-noir .titlebar .spacer { flex: 1 1 auto; }

.style-dev-noir kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border: 1px solid var(--dn-line-strong);
  border-radius: 4px;
  background: rgba(255, 255, 255, .05);
  box-shadow: 0 -1px 0 0 rgba(0, 0, 0, .5) inset;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 10px;
  line-height: 1;
  color: var(--dn-text-2);
}

.style-dev-noir .head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 13px;
}

.style-dev-noir .head h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 550;
  letter-spacing: -.022em;
  color: var(--dn-text);
}

.style-dev-noir .count {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 7px;
  border: 1px solid var(--dn-line);
  border-radius: 999px;
  background: rgba(255, 255, 255, .04);
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--dn-text-2);
}

.style-dev-noir .head .spacer { flex: 1 1 auto; }

.style-dev-noir .seg {
  display: flex;
  gap: 3px;
  padding: 2px;
  border: 1px solid var(--dn-line);
  border-radius: 7px;
  background: rgba(255, 255, 255, .025);
}

.style-dev-noir .seg span {
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 11.5px;
  color: var(--dn-text-3);
}

.style-dev-noir .seg span.on {
  background: rgba(255, 255, 255, .07);
  color: var(--dn-text);
  box-shadow: 0 1px 0 0 rgba(255, 255, 255, .06) inset;
}

.style-dev-noir .list {
  border-top: 1px solid var(--dn-line);
}

.style-dev-noir .row {
  position: relative;
  display: grid;
  grid-template-columns: 14px 1fr auto auto;
  align-items: center;
  gap: 11px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--dn-line);
  transition: background 140ms var(--dn-ease);
}

.style-dev-noir .row::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--dn-accent);
  box-shadow: 0 0 12px 0 rgba(124, 134, 232, .9);
  transform: scaleY(0);
  transition: transform 160ms var(--dn-ease);
}

.style-dev-noir .row:hover { background: rgba(255, 255, 255, .028); }
.style-dev-noir .row:hover::before { transform: scaleY(1); }

.style-dev-noir .dot {
  width: 6px;
  height: 6px;
  margin-left: 4px;
  border-radius: 50%;
  background: var(--dn-green);
  box-shadow: 0 0 0 3px rgba(76, 195, 138, .13), 0 0 10px 0 rgba(76, 195, 138, .55);
  animation: dev-noir-pulse 2.8s ease-in-out infinite;
}

.style-dev-noir .row.paused .dot {
  background: var(--dn-amber);
  box-shadow: 0 0 0 3px rgba(227, 164, 85, .12), 0 0 10px 0 rgba(227, 164, 85, .45);
  animation: none;
}

@keyframes dev-noir-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}

.style-dev-noir .name {
  font-size: 13.5px;
  font-weight: 450;
  letter-spacing: -.008em;
  color: var(--dn-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.style-dev-noir .time {
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--dn-text-3);
}

.style-dev-noir .status {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 8px;
  border-radius: 5px;
  border: 1px solid rgba(76, 195, 138, .22);
  background: rgba(76, 195, 138, .09);
  color: #7FD8AC;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .005em;
}

.style-dev-noir .row.paused .status {
  border-color: rgba(227, 164, 85, .22);
  background: rgba(227, 164, 85, .09);
  color: #EBBE83;
}

.style-dev-noir .search {
  position: relative;
  margin: 14px 18px 0;
}

.style-dev-noir .search svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 13px;
  height: 13px;
  color: var(--dn-text-3);
  pointer-events: none;
}

.style-dev-noir .search input {
  width: 100%;
  height: 34px;
  padding: 0 46px 0 31px;
  border: 1px solid var(--dn-line-control);
  border-radius: 8px;
  background: rgba(255, 255, 255, .028);
  color: var(--dn-text);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 140ms var(--dn-ease), box-shadow 140ms var(--dn-ease);
}

.style-dev-noir .search input::placeholder { color: var(--dn-text-3); }

.style-dev-noir .search input:hover { border-color: rgba(255, 255, 255, .48); }

.style-dev-noir .search input:focus {
  border-color: var(--dn-accent);
  box-shadow:
    0 0 0 3px rgba(94, 106, 210, .9),
    0 0 24px -6px rgba(94, 106, 210, .7);
}

.style-dev-noir .search kbd {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
}

.style-dev-noir .actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px 16px;
}

.style-dev-noir .btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 11px;
  border-radius: 7px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -.005em;
  cursor: pointer;
  transition: transform 130ms var(--dn-ease), box-shadow 130ms var(--dn-ease), background 130ms var(--dn-ease);
}

.style-dev-noir .btn-primary {
  border: 1px solid rgba(255, 255, 255, .16);
  background: linear-gradient(180deg, #6C77DE 0%, #545FC8 100%);
  color: #FFFFFF;
  box-shadow:
    0 1px 0 0 rgba(255, 255, 255, .18) inset,
    0 10px 26px -10px rgba(94, 106, 210, .85);
}

.style-dev-noir .btn-primary:hover {
  background: linear-gradient(180deg, #7883E6 0%, #5D68D2 100%);
  box-shadow:
    0 1px 0 0 rgba(255, 255, 255, .2) inset,
    0 12px 30px -8px rgba(94, 106, 210, 1);
}

.style-dev-noir .btn-primary kbd {
  border-color: rgba(255, 255, 255, .28);
  background: rgba(255, 255, 255, .16);
  color: #F2F2FF;
}

.style-dev-noir .btn-ghost {
  border: 1px solid var(--dn-line-strong);
  background: rgba(255, 255, 255, .04);
  color: var(--dn-text-2);
}

.style-dev-noir .btn-ghost:hover {
  background: rgba(255, 255, 255, .075);
  color: var(--dn-text);
}

.style-dev-noir .btn:active { transform: translateY(1px); }

.style-dev-noir .statusbar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 14px;
  border-top: 1px solid var(--dn-line);
  background: rgba(255, 255, 255, .018);
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 10px;
  letter-spacing: .02em;
  color: var(--dn-text-3);
  font-variant-numeric: tabular-nums;
}

.style-dev-noir .statusbar .spacer { flex: 1 1 auto; }

.style-dev-noir .statusbar i {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--dn-green);
  box-shadow: 0 0 8px 0 rgba(76, 195, 138, .8);
}

@media (max-width: 520px) {
  .style-dev-noir .demo { padding: 22px 12px; }
  .style-dev-noir .seg { display: none; }
  .style-dev-noir .row { grid-template-columns: 14px 1fr auto; }
  .style-dev-noir .time { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .style-dev-noir .dot { animation: none; }
  .style-dev-noir .row,
  .style-dev-noir .btn,
  .style-dev-noir .search input { transition-duration: 1ms; }
}
</style>
<div class="style-dev-noir">
  <div class="demo">
    <div class="app">
      <div class="titlebar">
        <svg class="mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="14" height="14" rx="4" stroke="#7C86E8" stroke-width="1.2"/>
          <path d="M4.5 10.5 8 5l3.5 5.5" stroke="#7C86E8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

      <div class="list">

        </div>
        <div class="row">

      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input type="text" readonly placeholder="Search..." aria-label="Search">
        <kbd>/</kbd>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="button">New project <kbd>N</kbd></button>
        <button class="btn btn-ghost" type="button">Import <kbd>I</kbd></button>

      <div class="statusbar">
        <i></i>
        <span>12 projects · 2 active</span>
        <span class="spacer"></span>

      </div>
    </div>
  </div>
</div>
