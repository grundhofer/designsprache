<style>
.style-hand-drawn {
  color-scheme: light;
  --hd-paper: #FBFAF6;
  --hd-ink: #1E1B18;
  --hd-graphite: #6B645B;
  --hd-marker: #B83A22;
  --hd-karo: rgba(30, 27, 24, .06);
  width: 100%;
  display: block;
  min-height: 460px;
  background: var(--hd-paper);
  color: var(--hd-ink);
  font-family: "Neucha", "Comic Sans MS", cursive;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 400;
  font-style: normal;
  letter-spacing: normal;
  word-spacing: normal;
  text-transform: none;
  text-align: left;
}

.style-hand-drawn,
.style-hand-drawn *,
.style-hand-drawn *::before,
.style-hand-drawn *::after { box-sizing: border-box; }

/* --- Blatt: Papierweiss plus 5,5%-Karo. Kein Rahmen, kein Schatten. ---- */
.style-hand-drawn .demo {
  position: relative;
  min-height: 460px;
  padding: 30px 44px 36px;
  background-color: var(--hd-paper);
  background-image:
    repeating-linear-gradient(0deg, var(--hd-karo) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, var(--hd-karo) 0 1px, transparent 1px 26px);
  background-position: 0 -4px, -4px 0;
  overflow: hidden;
}

.style-hand-drawn svg { display: block; overflow: visible; }
.style-hand-drawn .stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

/* --- Randnotiz: die eingebaute Botschaft des Stils --------------------- */
.style-hand-drawn .margin-note {
  position: absolute;
  top: 22px;
  right: 40px;
  width: 168px;
  color: var(--hd-marker);
  text-align: right;
}

.style-hand-drawn .margin-note em {
  display: inline-block;
  font-family: "Cabin Sketch", "Comic Sans MS", cursive;
  font-style: normal;
  font-size: 22px;
  line-height: 1.1;
  transform: rotate(-4.5deg);
}

.style-hand-drawn .margin-note small {
  display: block;
  margin-top: 1px;
  font-size: 15px;
  color: var(--hd-graphite);
  transform: rotate(-3deg);
}

.style-hand-drawn .margin-note .arrow {
  position: absolute;
  left: -46px;
  top: 26px;
  width: 78px;
  height: 48px;
  color: var(--hd-marker);
}

.style-hand-drawn .margin-note .arrow .stroke { stroke-width: 1.7; }

/* --- Kopfzeile -------------------------------------------------------- */
.style-hand-drawn .head {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 26px;
}

.style-hand-drawn .head h2 {
  position: relative;
  margin: 0;
  padding-bottom: 12px;
  font-family: "Cabin Sketch", "Comic Sans MS", cursive;
  font-weight: 700;
  font-size: 42px;
  line-height: 1.05;
  letter-spacing: .005em;
  color: var(--hd-ink);
}

.style-hand-drawn .head h2 .rule {
  position: absolute;
  left: -4px;
  bottom: -6px;
  width: 236px;
  height: 16px;
  color: var(--hd-marker);
}

.style-hand-drawn .head h2 .rule .stroke { stroke-width: 2.1; }
.style-hand-drawn .head h2 .rule .second { stroke-width: 1.4; opacity: .72; }

.style-hand-drawn .tally {
  position: relative;
  flex: none;
  width: 62px;
  height: 54px;
  margin-top: 2px;
  color: var(--hd-ink);
}

.style-hand-drawn .tally svg {
  position: absolute;
  left: 0;
  top: 0;
}

.style-hand-drawn .tally .stroke { stroke-width: 1.9; }
.style-hand-drawn .tally .second { stroke-width: 1.2; opacity: .6; }

.style-hand-drawn .tally b {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-bottom: 2px;
  font-family: "Cabin Sketch", "Comic Sans MS", cursive;
  font-weight: 400;
  font-size: 26px;
  line-height: 1;
}

/* --- Liste: jeder Eintrag ein einzeln gezeichnetes Rechteck ------------ */
.style-hand-drawn .list {
  display: flex;
  flex-direction: column;
  gap: 22px;
  margin-bottom: 30px;
}

.style-hand-drawn .entry {
  position: relative;
  display: grid;
  grid-template-columns: 40px 1fr 132px 122px;
  align-items: center;
  gap: 16px;
  height: 64px;
  padding: 0 24px;
  color: var(--hd-ink);
}

.style-hand-drawn .entry .outline {
  position: absolute;
  left: 0;
  top: 0;
  width: 692px;
  height: 64px;
  color: var(--hd-ink);
  pointer-events: none;
}

.style-hand-drawn .entry .outline .stroke { stroke-width: 1.9; }
.style-hand-drawn .entry .outline .second { stroke-width: 1.1; opacity: .55; }

.style-hand-drawn .entry .idx {
  position: relative;
  font-size: 16px;
  color: var(--hd-graphite);
  letter-spacing: .04em;
}

.style-hand-drawn .entry .title {
  position: relative;
  font-size: 22px;
  line-height: 1.2;
  color: var(--hd-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.style-hand-drawn .entry .when {
  position: relative;
  text-align: right;
  font-size: 17px;
  color: var(--hd-graphite);
  white-space: nowrap;
}

/* --- Status: Hachur statt Vollton, Deckung aus dem Linienabstand ------- */
.style-hand-drawn .state {
  position: relative;
  justify-self: end;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 34px;
  font-size: 17px;
  line-height: 1.25;
  white-space: nowrap;
}

/* Kontur auch hier gezeichnet statt gerahmt: ein gerader CSS-Rand waere
   die einzige maschinelle Kante auf dem ganzen Blatt. */
.style-hand-drawn .state .edge {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 34px;
  pointer-events: none;
}

.style-hand-drawn .state .edge .stroke { stroke-width: 1.8; }
.style-hand-drawn .state .edge .second { stroke-width: 1.1; opacity: .55; }

/* Die Hachur liegt auf einer eigenen Ebene mit asymmetrischem Radius
   (Bootswatch-Sketchy-Vierergruppen, woertlich), damit auch die Flaeche
   keine gerade Kante bekommt. */
.style-hand-drawn .state::before {
  content: "";
  position: absolute;
  inset: 3px 4px 4px 3px;
  pointer-events: none;
}

.style-hand-drawn .state span {
  position: relative;
  color: var(--hd-ink);
}

/* Aktiv: hachureAngle -41 Grad, Strich 1,1px, Abstand 4x Strich = 4,4px */
.style-hand-drawn .state.live {
  width: 86px;
  color: var(--hd-marker);
}

.style-hand-drawn .state.live::before {
  border-radius: 255px 25px 225px 25px / 25px 225px 25px 255px;
  background-image: repeating-linear-gradient(-41deg,
    var(--hd-marker) 0 1.1px, transparent 1.1px 5.5px);
}

.style-hand-drawn .entry:nth-child(2) .state.live::before {
  border-radius: 45px 85px 15px 25px / 15px 10px 35px 555px;
  background-position: 3px 0;
}

/* Pausiert: gleicher Strich, doppelter Abstand - geringere Deckung */
.style-hand-drawn .state.held {
  width: 108px;
  color: var(--hd-graphite);
}

.style-hand-drawn .state.held::before {
  border-radius: 25px 225px 25px 255px / 255px 25px 225px 25px;
  background-image: repeating-linear-gradient(-41deg,
    var(--hd-graphite) 0 1.1px, transparent 1.1px 10.5px);
}

/* --- Eingabefeld: eine einzelne wellige Grundlinie, kein Kasten -------- */
.style-hand-drawn .find {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 34px;
  margin: 0 0 30px;
  padding-left: 2px;
}

.style-hand-drawn .find .lens {
  flex: none;
  width: 23px;
  height: 23px;
  color: var(--hd-graphite);
}

.style-hand-drawn .find .lens .stroke { stroke-width: 1.8; }

.style-hand-drawn .find input {
  flex: 1 1 auto;
  min-width: 0;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--hd-ink);
  font-family: inherit;
  font-size: 20px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}

.style-hand-drawn .find input::placeholder {
  color: var(--hd-graphite);
  opacity: 1;
}

.style-hand-drawn .find .baseline {
  position: absolute;
  left: 0;
  bottom: -12px;
  width: 692px;
  height: 16px;
  color: var(--hd-ink);
}

/* Mindestens 2px: die Grundlinie ist der einzige Rand des Bedienelements
   und muss die 3:1-Anforderung allein tragen. */
.style-hand-drawn .find .baseline .stroke { stroke-width: 2; }
.style-hand-drawn .find .baseline .second { stroke-width: 1.1; opacity: .5; }

/* --- Aktionen: kein Offset-Schatten, keine z-Achse --------------------- */
.style-hand-drawn .acts {
  display: flex;
  align-items: center;
  gap: 26px;
}

.style-hand-drawn .act {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 50px;
  padding: 0 22px;
  border: 0;
  background: transparent;
  font-family: inherit;
  font-size: 21px;
  line-height: 1;
  color: var(--hd-ink);
  cursor: pointer;
}

.style-hand-drawn .act .outline {
  position: absolute;
  left: 0;
  top: 0;
  height: 50px;
  pointer-events: none;
}

.style-hand-drawn .act .label { position: relative; }

.style-hand-drawn .act-lead .label { color: var(--hd-ink); }

.style-hand-drawn .act-lead {
  width: 178px;
  color: var(--hd-marker);
}

/* Fuellung des Primaerbuttons: Hachur mit 2px Strich und 8px Abstand
   (4x Strichstaerke), damit die Schrift durch das Papier lesbar bleibt. */
.style-hand-drawn .act-lead::before {
  content: "";
  position: absolute;
  inset: 6px 7px 5px 6px;
  border-radius: 225px 25px 255px 25px / 25px 255px 25px 225px;
  background-image: repeating-linear-gradient(-41deg,
    var(--hd-marker) 0 2px, transparent 2px 10px);
  pointer-events: none;
}

.style-hand-drawn .act-lead .outline { width: 178px; }
.style-hand-drawn .act-lead .stroke { stroke-width: 2.3; }
.style-hand-drawn .act-lead .second { stroke-width: 1.4; opacity: .7; }

.style-hand-drawn .act-side {
  width: 152px;
  color: var(--hd-graphite);
}

.style-hand-drawn .act-side .outline { width: 152px; }
.style-hand-drawn .act-side .stroke { stroke-width: 1.7; }
.style-hand-drawn .act-side .second { stroke-width: 1.1; opacity: .5; }

/* Zustandswechsel ohne Versatz: die Kontur wird mit anderem Seed
   nachgezogen. Die Demo ist nicht bedienbar, also laeuft es als Schleife. */
.style-hand-drawn .act-lead .take-a { animation: hand-drawn-reroll-a 3.4s steps(1, end) infinite; }
.style-hand-drawn .act-lead .take-b { animation: hand-drawn-reroll-b 3.4s steps(1, end) infinite; }

@keyframes hand-drawn-reroll-a {
  0%, 49.9% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@keyframes hand-drawn-reroll-b {
  0%, 49.9% { opacity: 0; }
  50%, 100% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .style-hand-drawn .act-lead .take-a { animation: none; opacity: 1; }
  .style-hand-drawn .act-lead .take-b { animation: none; opacity: 0; }
}
</style>
