<style>
.style-apple-liquid-glass { --paper:#EEF3FA; --ink:#172434; --blue:#0069DB; --line:#B5C3D4;
  box-sizing:border-box; min-height:460px; padding:26px; background:linear-gradient(135deg,#DEE9F7,#EEF3FA 50%,#F8FAFD);
  color:var(--ink); color-scheme:light; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.style-apple-liquid-glass * { box-sizing:border-box; }
.style-apple-liquid-glass .window { background:#FFFFFF; border:1px solid var(--line); border-radius:28px;
  box-shadow:0 18px 50px #17243420; overflow:hidden; }
.style-apple-liquid-glass .toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 24px; background:#E6EFF9; border-bottom:1px solid var(--line); }
.style-apple-liquid-glass .workspace { font-size:14px; font-weight:600; }
.style-apple-liquid-glass .dots { display:flex; gap:7px; }
.style-apple-liquid-glass .dots i { display:block; width:9px; height:9px; border:1px solid #718399; border-radius:50%; }
.style-apple-liquid-glass .content { padding:28px 28px 18px; }
.style-apple-liquid-glass .heading { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; }
.style-apple-liquid-glass h2 { font-size:34px; line-height:1.15; letter-spacing:-.035em; margin:0; font-weight:700; }
.style-apple-liquid-glass .count { font-size:16px; font-weight:600; background:#EEF3FA; border-radius:999px; padding:5px 13px; }
.style-apple-liquid-glass ul { padding:0; margin:0; list-style:none; }
.style-apple-liquid-glass li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 24px;
  padding:14px 0; border-bottom:1px solid #DCE3ED; }
.style-apple-liquid-glass li:last-child { border-bottom:0; }
.style-apple-liquid-glass .name { font-weight:600; font-size:18px; }
.style-apple-liquid-glass .time { grid-column:1; font-size:14px; color:#4D5F74; }
.style-apple-liquid-glass .status { grid-column:2; grid-row:1 / 3; align-self:center; font-size:14px; color:#0061B8; }
.style-apple-liquid-glass .paused { color:#4D5F74; }
.style-apple-liquid-glass .dock { margin:0 18px 18px; padding:10px; display:flex; flex-wrap:wrap; align-items:center;
  gap:10px; background:#E6EFF9; border:1px solid #FFFFFF; border-radius:999px;
  box-shadow:0 5px 15px #17243418,inset 0 1px 0 #FFFFFF; }
.style-apple-liquid-glass input { flex:1 1 160px; width:160px; min-width:0; min-height:44px; padding:10px 14px;
  border:1px solid #B5C3D4; border-radius:999px; background:#FFFFFF; color:var(--ink); font:inherit; }
.style-apple-liquid-glass input::placeholder { color:#4D5F74; opacity:1; }
.style-apple-liquid-glass button { min-height:44px; padding:10px 18px; border:0; border-radius:999px;
  font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#FFFFFF; color:var(--ink); }
.style-apple-liquid-glass .primary { background:var(--blue); color:#FFFFFF; }
.style-apple-liquid-glass .caption { margin:14px 4px 0; color:#4D5F74; font-size:12px; }
@supports (backdrop-filter:blur(1px)) {
  .style-apple-liquid-glass .toolbar, .style-apple-liquid-glass .dock { background:#E6EFF9E8; backdrop-filter:blur(20px) saturate(1.2); }
}
@media (prefers-reduced-transparency:reduce), (prefers-contrast:more) {
  .style-apple-liquid-glass .toolbar, .style-apple-liquid-glass .dock { background:#E6EFF9; backdrop-filter:none; border:1px solid #718399; }
}
</style>
<div class="style-apple-liquid-glass">
  <div class="window">
    <div class="toolbar"><span class="workspace">Arbeitsbereich</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
    <div class="content">
      <div class="heading"><h2>Projekte</h2><span class="count">12</span></div>
      <ul>
        <li><span class="name">Nexus</span><span class="time">vor 2 Std.</span><span class="status">Aktiv</span></li>
        <li><span class="name">Autowrite Studio</span><span class="time">gestern</span><span class="status">Aktiv</span></li>
        <li><span class="name">Balance Ally</span><span class="time">vor 4 Tagen</span><span class="status paused">Pausiert</span></li>
      </ul>
    </div>
    <div class="dock"><input type="search" readonly placeholder="Suchen…" aria-label="Projekte durchsuchen"><button type="button" class="primary">Neues Projekt</button><button type="button">Importieren</button></div>
  </div>
  <p class="caption">Deckende Inhalte · separate Materialschicht für Navigation und Aktionen</p>
</div>
