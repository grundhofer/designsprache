<style>
.style-maximalism {
  color-scheme: light;
  /* Riso-Sonderfarben mit publizierten Tintenwerten (Pantone-U-Referenz der Drumfarben) */
  --mx-ink: #1B1714;      /* Zeitungsschwarz, in unbeschichtetes Papier eingesunken */
  --mx-paper: #D3CBB7;    /* Zeitungspapier, graubeige */
  --mx-sheet: #DFD8C6;    /* aufgeklebter Bogen, eine Nuance heller als der Grund */
  --mx-orange: #FF6C2F;   /* Riso Orange, Pantone Orange 021 U */
  --mx-red: #F15060;      /* Riso Bright Red, Pantone 032 U */
  --mx-blue: #375E77;     /* Riso Steel, Pantone 302 U */
  --mx-gold: #AC936E;     /* Riso Metallic Gold, Pantone 874 U */
  --mx-gold-hi: #E4D3AE;
  --mx-gold-lo: #7C6949;
  --mx-scrap: #EDE7D8;    /* helleres Fremdpapier: der eingeklebte Fotoausriss */
  --mx-misfit: 2px;       /* Registerversatz: eine Ebene um diesen Betrag daneben */
  background:
    repeating-linear-gradient(45deg, rgba(27,23,20,.07) 0 3px, transparent 3px 9px),
    radial-gradient(circle at 50% 50%, rgba(241,80,96,.34) 2px, transparent 2.2px) 2px 1px / 11px 11px,
    radial-gradient(circle at 50% 50%, rgba(55,94,119,.30) 1.8px, transparent 2px) 0 3px / 11px 11px,
    radial-gradient(circle at 50% 50%, rgba(27,23,20,.26) 1.7px, transparent 1.9px) 0 0 / 11px 11px,
    var(--mx-paper);
  color: var(--mx-ink);
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  line-height: 1.35;
  font-weight: 400;
  font-style: normal;
  letter-spacing: normal;
  word-spacing: normal;
  text-transform: none;
  text-align: left;
  width: 100%;
  display: block;
}
.style-maximalism,
.style-maximalism * { box-sizing: border-box; }

.style-maximalism .demo {
  position: relative;
  overflow: hidden;
  min-height: 460px;
  padding: 30px 26px 34px;
  border: 4px solid var(--mx-ink);
}

/* --- Deko-Ebenen: Klebeband, Siegel, Barcode, Passkreuz, Ausriss ------- */
.style-maximalism .deco { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.style-maximalism .deco-top { z-index: 2; }
.style-maximalism .tape {
  position: absolute;
  border: 2px solid var(--mx-ink);
  opacity: .95;
}
/* Gummiertes Goldband: Metallicfolie als Collage-Element */
.style-maximalism .tape-1 {
  width: 190px; height: 26px;
  top: 14px; left: -34px;
  background: linear-gradient(104deg,
    var(--mx-gold-lo) 0 8%, var(--mx-gold) 20%, var(--mx-gold-hi) 34%,
    var(--mx-gold) 46%, var(--mx-gold-lo) 62%, var(--mx-gold-hi) 78%, var(--mx-gold) 100%);
  transform: rotate(-19deg);
}
/* Riso-Klebestreifen, zwei Tinten ausser Register uebereinander */
.style-maximalism .tape-2 {
  width: 150px; height: 22px;
  bottom: 86px; right: -28px;
  background: repeating-linear-gradient(90deg, var(--mx-orange) 0 7px, transparent 7px 14px);
  transform: rotate(24deg);
}
.style-maximalism .tape-2::before {
  content: "";
  position: absolute;
  inset: -2px;
  background: repeating-linear-gradient(90deg, var(--mx-blue) 0 7px, transparent 7px 14px);
  transform: translate(calc(var(--mx-misfit) * 1.5), var(--mx-misfit));
  mix-blend-mode: multiply;
}
/* Siegel: zwei deckungsgleiche Kreise, um 3px versetzt gedruckt */
.style-maximalism .tape-3 {
  width: 88px; height: 88px;
  left: -20px; top: 268px;
  border: 0;
  transform: rotate(-6deg);
}
.style-maximalism .tape-3::before,
.style-maximalism .tape-3::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  mix-blend-mode: multiply;
}
.style-maximalism .tape-3::before {
  background: var(--mx-red);
  transform: translate(calc(var(--mx-misfit) * 2), calc(var(--mx-misfit) * -1.5));
}
.style-maximalism .tape-3::after {
  background: var(--mx-blue);
  transform: translate(calc(var(--mx-misfit) * -2), calc(var(--mx-misfit) * 1.5));
}
.style-maximalism .barcode {
  position: absolute;
  left: 306px; top: 4px;
  width: 116px; height: 24px;
  background: repeating-linear-gradient(90deg, var(--mx-ink) 0 2px, transparent 2px 4px, var(--mx-ink) 4px 5px, transparent 5px 9px);
  opacity: .62;
  transform: rotate(-1.5deg);
  filter: drop-shadow(2px 1px 0 var(--mx-blue));
}
.style-maximalism .star {
  position: absolute;
  color: var(--mx-ink);
}
.style-maximalism .star svg { display: block; }
.style-maximalism .star-1 { top: 236px; left: 2px; transform: rotate(-12deg); }
/* Passkreuz: der Versatz sitzt hier auf dem Zeichen, das ihn verhindern soll */
.style-maximalism .star-2 {
  right: 30px; bottom: 12px;
  transform: rotate(6deg);
  filter: drop-shadow(2px 1.5px 0 var(--mx-red)) drop-shadow(-2px -1.5px 0 var(--mx-blue));
}

/* --- Fotoausriss: Halbton-Verlauf mit unregelmaessiger Kante ----------- */
.style-maximalism .tear {
  position: absolute;
  top: -18px; right: 168px;
  width: 140px; height: 96px;
  transform: rotate(-5deg);
  background: var(--mx-scrap);
  filter: drop-shadow(4px 3px 0 rgba(27,23,20,.45));
  clip-path: polygon(
    3% 6%, 14% 1%, 27% 7%, 41% 2%, 55% 8%, 68% 2%, 82% 7%, 95% 1%, 100% 14%,
    96% 29%, 100% 43%, 95% 57%, 100% 72%, 94% 86%, 97% 97%, 84% 93%, 70% 99%,
    56% 92%, 43% 98%, 29% 91%, 16% 97%, 4% 90%, 0 76%, 4% 61%, 0 47%, 5% 33%, 0 19%
  );
}
.style-maximalism .tear::before,
.style-maximalism .tear::after {
  content: "";
  position: absolute;
  inset: 0;
}
/* grobe Punkte in den Tiefen, mit Registerversatz in Rot */
.style-maximalism .tear::before {
  background: radial-gradient(circle at 50% 50%, var(--mx-ink) 42%, transparent 46%) 0 0 / 8px 8px;
  -webkit-mask-image: linear-gradient(197deg, #000 0 34%, rgba(0,0,0,.35) 58%, transparent 78%);
  mask-image: linear-gradient(197deg, #000 0 34%, rgba(0,0,0,.35) 58%, transparent 78%);
  filter: drop-shadow(2px 1px 0 var(--mx-red));
}
/* feine Punkte in den Lichtern, versetzt in Stahlblau */
.style-maximalism .tear::after {
  background: radial-gradient(circle at 50% 50%, var(--mx-ink) 30%, transparent 34%) 0 0 / 5px 5px;
  -webkit-mask-image: linear-gradient(197deg, transparent 22%, rgba(0,0,0,.55) 52%, #000 92%);
  mask-image: linear-gradient(197deg, transparent 22%, rgba(0,0,0,.55) 52%, #000 92%);
  filter: drop-shadow(-2px -1px 0 var(--mx-blue));
}

/* --- Rahmen im Rahmen ------------------------------------------------- */
.style-maximalism .frame {
  position: relative;
  z-index: 1;
  background: var(--mx-sheet);
  border: 3px solid var(--mx-ink);
  box-shadow: 11px 11px 0 var(--mx-ink), 20px 20px 0 var(--mx-blue);
  transform: rotate(-0.8deg);
  padding: 7px;
}
.style-maximalism .inner {
  border: 2px dashed var(--mx-ink);
  padding: 20px 18px 22px;
}

/* --- Kopf ------------------------------------------------------------- */
.style-maximalism .head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}
.style-maximalism .title {
  margin: 0;
  font-family: "Anton", Impact, "Arial Narrow", sans-serif;
  font-weight: 400;
  font-size: 54px;
  line-height: .86;
  letter-spacing: -0.005em;
  text-transform: uppercase;
  color: var(--mx-sheet);
  -webkit-text-stroke: 2.5px var(--mx-ink);
  paint-order: stroke fill;
  text-shadow: 3px 2px 0 var(--mx-red), -3px -2px 0 var(--mx-blue);
  transform: rotate(-2deg) skewX(-4deg);
  transform-origin: left bottom;
}
.style-maximalism .counter {
  position: relative;
  flex: none;
  width: 84px; height: 84px;
  display: grid;
  place-items: center;
  transform: rotate(11deg);
  animation: maximalism-wiggle 6s ease-in-out infinite;
}
.style-maximalism .counter .burst {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  color: var(--mx-red);
  filter: drop-shadow(-3px -2px 0 var(--mx-blue));
}
.style-maximalism .counter .num {
  position: relative;
  font-family: "DM Serif Display", Georgia, serif;
  font-size: 34px;
  line-height: 1;
  color: var(--mx-sheet);
  text-shadow: 2px 2px 0 var(--mx-ink);
  padding-bottom: 3px;
}
@keyframes maximalism-wiggle {
  0%, 100% { transform: rotate(11deg) scale(1); }
  50%      { transform: rotate(4deg) scale(1.045); }
}

/* --- Zierbalken: derselbe Balken zweimal, um 4px auseinander gedruckt -- */
.style-maximalism .rule {
  position: relative;
  height: 18px;
  margin: 14px 0 18px;
  transform: rotate(.5deg);
}
.style-maximalism .rule::before,
.style-maximalism .rule::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, currentcolor 0 12px, transparent 12px 24px);
  mix-blend-mode: multiply;
}
.style-maximalism .rule::before {
  color: var(--mx-orange);
  transform: translate(calc(var(--mx-misfit) * -1), calc(var(--mx-misfit) * -0.5));
}
.style-maximalism .rule::after {
  color: var(--mx-blue);
  transform: translate(var(--mx-misfit), calc(var(--mx-misfit) * 0.5));
}

/* --- Liste ------------------------------------------------------------ */
.style-maximalism .list {
  list-style: none;
  margin: 0 0 20px;
  padding: 0;
}
.style-maximalism .row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border: 2.5px solid var(--mx-ink);
  margin-bottom: -6px;
}
.style-maximalism .row-1 {
  background:
    repeating-linear-gradient(-45deg, rgba(27,23,20,.17) 0 6px, transparent 6px 13px),
    var(--mx-red);
  box-shadow: 6px 6px 0 var(--mx-blue);
  transform: rotate(-1.2deg);
  z-index: 1;
}
.style-maximalism .row-2 {
  background:
    radial-gradient(circle at 50% 50%, rgba(27,23,20,.26) 1.8px, transparent 2px) 0 0 / 9px 9px,
    var(--mx-orange);
  box-shadow: 6px 6px 0 var(--mx-ink);
  transform: rotate(0.9deg);
  margin-left: 14px;
  z-index: 2;
}
.style-maximalism .row-3 {
  background:
    radial-gradient(circle at 50% 50%, rgba(223,216,198,.22) 2px, transparent 2.2px) 0 0 / 9px 9px,
    var(--mx-blue);
  color: var(--mx-sheet);
  box-shadow: 6px 6px 0 var(--mx-orange);
  transform: rotate(-1.6deg);
  margin-right: 10px;
  z-index: 3;
}
.style-maximalism .idx {
  position: relative;
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  font-family: "Space Mono", ui-monospace, monospace;
  font-size: 13px;
  font-weight: 700;
  background: var(--mx-gold);
  color: var(--mx-ink);
  border: 2px solid var(--mx-ink);
  border-radius: 50%;
}
.style-maximalism .idx::before {
  content: "";
  position: absolute;
  inset: -2px;
  border: 2px solid var(--mx-blue);
  border-radius: 50%;
  transform: translate(calc(var(--mx-misfit) * -1), calc(var(--mx-misfit) * -0.75));
  mix-blend-mode: multiply;
}
.style-maximalism .name {
  flex: 1 1 auto;
  min-width: 0;
}
.style-maximalism .row-1 .name {
  font-family: "Anton", Impact, sans-serif;
  font-size: 19px;
  text-transform: uppercase;
  letter-spacing: .01em;
}
.style-maximalism .row-2 .name {
  font-family: "DM Serif Display", Georgia, serif;
  font-style: italic;
  font-size: 21px;
}
.style-maximalism .row-3 .name {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -.01em;
}
.style-maximalism .when {
  flex: none;
  font-family: "Space Mono", ui-monospace, monospace;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: .02em;
  padding: 2px 6px;
  border: 1.5px solid currentColor;
}
.style-maximalism .status {
  position: relative;
  flex: none;
  font-family: "Space Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 5px 10px;
  border: 2px solid var(--mx-ink);
  color: var(--mx-ink);
  white-space: nowrap;
}
.style-maximalism .status::before {
  content: "";
  position: absolute;
  inset: -2px;
  border: 2px solid var(--mx-blue);
  transform: translate(calc(var(--mx-misfit) * -1), calc(var(--mx-misfit) * -0.75));
  mix-blend-mode: multiply;
}
.style-maximalism .status-on {
  background: linear-gradient(102deg,
    var(--mx-gold) 0 16%, var(--mx-gold-hi) 34%,
    var(--mx-gold) 52%, var(--mx-gold-hi) 74%, var(--mx-gold) 100%);
  box-shadow: 3px 3px 0 var(--mx-ink);
  transform: rotate(4deg);
}
.style-maximalism .status-off {
  background: var(--mx-orange);
  box-shadow: 3px 3px 0 var(--mx-ink);
  transform: rotate(-5deg);
}

/* --- Suchfeld --------------------------------------------------------- */
.style-maximalism .seek {
  position: relative;
  display: flex;
  align-items: stretch;
  margin: 26px 0 20px;
  border: 2.5px solid var(--mx-ink);
  background: var(--mx-sheet);
  box-shadow: 6px 6px 0 var(--mx-red);
  transform: rotate(.6deg);
}
.style-maximalism .seek-tag {
  flex: none;
  display: grid;
  place-items: center;
  width: 46px;
  background: var(--mx-ink);
  color: var(--mx-paper);
  font-size: 18px;
}
.style-maximalism .seek input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  padding: 12px 14px;
  font-family: "Space Mono", ui-monospace, monospace;
  font-size: 14px;
  letter-spacing: .04em;
  color: var(--mx-ink);
}
.style-maximalism .seek input::placeholder {
  color: var(--mx-ink);
  opacity: .62;
  text-transform: uppercase;
}

/* --- Aktionen --------------------------------------------------------- */
.style-maximalism .actions {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.style-maximalism .btn {
  border: 2.5px solid var(--mx-ink);
  cursor: pointer;
  padding: 13px 22px;
  transition: transform 90ms linear, box-shadow 90ms linear;
}
.style-maximalism .btn-primary {
  font-family: "Anton", Impact, sans-serif;
  font-size: 19px;
  letter-spacing: .02em;
  text-transform: uppercase;
  background: var(--mx-ink);
  color: var(--mx-paper);
  box-shadow: -3px -2px 0 var(--mx-blue), 7px 7px 0 var(--mx-orange), 7px 7px 0 2.5px var(--mx-ink);
  transform: rotate(-1.6deg);
}
.style-maximalism .btn-primary:hover {
  transform: rotate(-1.6deg) translate(3px, 3px);
  box-shadow: -3px -2px 0 var(--mx-blue), 3px 3px 0 var(--mx-orange), 3px 3px 0 2.5px var(--mx-ink);
}
.style-maximalism .btn-ghost {
  font-family: "Space Mono", ui-monospace, monospace;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: var(--mx-sheet);
  color: var(--mx-ink);
  border-style: dashed;
  transform: rotate(1.8deg);
}
.style-maximalism .btn-ghost:hover { background: var(--mx-gold); }
.style-maximalism .btn:focus-visible {
  outline: 3px solid var(--mx-blue);
  outline-offset: 3px;
}
.style-maximalism .arrow {
  margin-left: auto;
  color: var(--mx-ink);
  transform: rotate(-8deg);
  filter: drop-shadow(2px 1.5px 0 var(--mx-orange));
}
.style-maximalism .arrow svg { display: block; width: 62px; height: 30px; }

@media (prefers-reduced-motion: reduce) {
  .style-maximalism .counter { animation: none; }
}
@media (max-width: 560px) {
  .style-maximalism .demo { padding: 20px 14px 26px; }
  .style-maximalism .title { font-size: 38px; text-shadow: 2px 1.5px 0 var(--mx-orange), -2px -1.5px 0 var(--mx-blue); }
  .style-maximalism .counter { width: 64px; height: 64px; }
  .style-maximalism .counter .num { font-size: 26px; }
  .style-maximalism .frame { box-shadow: 7px 7px 0 var(--mx-ink), 13px 13px 0 var(--mx-blue); }
  .style-maximalism .row { flex-wrap: wrap; gap: 8px 10px; }
  .style-maximalism .row-2 { margin-left: 0; }
  .style-maximalism .row-3 { margin-right: 0; }
  .style-maximalism .tear { top: -14px; right: 8px; width: 104px; height: 74px; }
  .style-maximalism .arrow { display: none; }
}
</style>
