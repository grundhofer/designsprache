<style>
.style-swiss {
  --paper: #ffffff;
  --ink: #0b0b0b;
  --grey: #6e6e6e;
  --hair: #d4d4d4;
  --red: #e30613;
  --pad: clamp(20px, 4.6vw, 56px);
  --base: 24px;
  width: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height: 1.35;
  font-size: 15px;
  color-scheme: light;
  -webkit-font-smoothing: antialiased;
}
.style-swiss,
.style-swiss * { box-sizing: border-box; }

.style-swiss .demo {
  position: relative;
  min-height: 460px;
  padding: var(--pad);
  padding-left: calc(var(--pad) + 34px);
  background: var(--paper);
  border: 1px solid var(--ink);
  overflow: hidden;
}

.style-swiss .raster {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(var(--pad) + 34px);
  right: var(--pad);
  pointer-events: none;
  background-image:
    repeating-linear-gradient(to right,
      rgba(227, 6, 19, 0.16) 0, rgba(227, 6, 19, 0.16) 1px,
      transparent 1px, transparent calc(100% / 12)),
    repeating-linear-gradient(to bottom,
      rgba(11, 11, 11, 0.06) 0, rgba(11, 11, 11, 0.06) 1px,
      transparent 1px, transparent var(--base));
}
.style-swiss .raster::after {
  content: "";
  position: absolute;
  inset: 0 0 0 auto;
  width: 1px;
  background: rgba(227, 6, 19, 0.16);
}

.style-swiss .marginalie {
  position: absolute;
  left: var(--pad);
  bottom: var(--pad);
  transform-origin: left bottom;
  transform: rotate(-90deg);
  white-space: nowrap;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--grey);
}

/* Legende zum sichtbaren Raster: laeuft als Mikrozeile ueber der Zeile,
   nicht absolut in die Ecke - dort kollidiert sie mit dem Zaehler. */
.style-swiss .folio {
  position: relative;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--grey);
  text-align: right;
  line-height: 1.6;
  padding-bottom: 16px;
}
.style-swiss .folio b { color: var(--ink); font-weight: 700; }

.style-swiss .sheet { position: relative; }

.style-swiss .head {
  display: grid;
  grid-template-columns: 9fr 3fr;
  align-items: end;
  gap: 0 12px;
  padding-bottom: 10px;
}
.style-swiss .head h2 {
  margin: 0;
  font-size: clamp(46px, 9.5vw, 96px);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.86;
  text-indent: -0.045em;
}
.style-swiss .count {
  margin: 0;
  text-align: right;
  font-size: clamp(46px, 9.5vw, 96px);
  font-weight: 700;
  letter-spacing: -0.06em;
  line-height: 0.86;
  color: var(--red);
  font-variant-numeric: tabular-nums;
}

.style-swiss .rule-heavy { height: 3px; background: var(--ink); }
.style-swiss .rule-hair { height: 1px; background: var(--hair); }

.style-swiss .legend {
  display: grid;
  grid-template-columns: 6fr 3fr 3fr;
  gap: 0 12px;
  padding: 8px 0 9px;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--grey);
}
.style-swiss .legend span:nth-child(3) { text-align: right; }

.style-swiss ul.liste {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--ink);
}
.style-swiss ul.liste li {
  display: grid;
  grid-template-columns: 6fr 3fr 3fr;
  align-items: baseline;
  gap: 0 12px;
  padding: 15px 0 16px;
  border-bottom: 1px solid var(--hair);
}
.style-swiss ul.liste li:last-child { border-bottom: 1px solid var(--ink); }

.style-swiss .name {
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -0.018em;
}
.style-swiss .zeit {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--grey);
  font-variant-numeric: tabular-nums;
}
.style-swiss .status {
  justify-self: end;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.style-swiss .status i {
  width: 7px;
  height: 7px;
  display: block;
  font-style: normal;
}
.style-swiss .status.aktiv i { background: var(--red); }
.style-swiss .status.pausiert { color: var(--grey); }
.style-swiss .status.pausiert i { box-shadow: inset 0 0 0 1px var(--grey); }

.style-swiss .feld {
  display: grid;
  grid-template-columns: 9fr 3fr;
  gap: 0 12px;
  align-items: end;
  margin-top: 34px;
}
.style-swiss .feld input {
  width: 100%;
  margin: 0;
  padding: 0 0 9px 12px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--ink);
  border-left: 2px solid var(--red);
  border-radius: 0;
  outline: none;
}
.style-swiss .feld input::placeholder { color: var(--grey); opacity: 1; }
.style-swiss .feld input:focus {
  border-bottom: 2px solid var(--red);
  padding-bottom: 8px;
}
.style-swiss .feld .mass {
  text-align: right;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--grey);
  padding-bottom: 10px;
}

.style-swiss .aktionen {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 30px;
}
.style-swiss .aktionen button {
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  height: 44px;
  padding: 0 26px;
  border-radius: 0;
  border: 1px solid var(--ink);
  cursor: pointer;
  transition: background-color 110ms linear, color 110ms linear, border-color 110ms linear;
}
.style-swiss .aktionen .primaer {
  background: var(--ink);
  color: var(--paper);
}
.style-swiss .aktionen .primaer:hover {
  background: var(--red);
  border-color: var(--red);
}
.style-swiss .aktionen .sekundaer {
  background: transparent;
  color: var(--ink);
}
.style-swiss .aktionen .sekundaer:hover {
  background: var(--ink);
  color: var(--paper);
}

.style-swiss .fuss {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 30px;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--grey);
}
.style-swiss .fuss .balken {
  height: 6px;
  width: 96px;
  background: var(--red);
  flex: none;
}

@media (max-width: 640px) {
  .style-swiss .head { grid-template-columns: 1fr auto; }
  .style-swiss ul.liste li,
  .style-swiss .legend { grid-template-columns: 5fr 3fr 4fr; }
  .style-swiss .feld { grid-template-columns: 1fr; }
  .style-swiss .feld .mass { display: none; }
  .style-swiss .marginalie { display: none; }
  .style-swiss .demo { padding-left: var(--pad); }
  .style-swiss .raster { left: var(--pad); }
}
</style>
<div class="style-swiss">
  <div class="demo">
    <div class="raster" aria-hidden="true"></div>
    <div class="marginalie">International Typographic Style · Zürich</div>
    <div class="folio">Grid <b>12</b> columns · Base <b>24 px</b></div>
    <div class="sheet">
      <div class="head">
        <h2>Projects</h2>
        <p class="count">12</p>
      </div>
      <div class="rule-heavy"></div>
      <div class="legend"><span>Name</span><span>Time</span><span>Status</span></div>
      <ul class="liste">
        <li>
          <span class="name">Nexus</span>
          <span class="zeit">2 hrs ago</span>
          <span class="status aktiv"><i></i>Active</span>
        </li>
        <li>
          <span class="name">Autowrite Studio</span>
          <span class="zeit">yesterday</span>
          <span class="status aktiv"><i></i>Active</span>
        </li>
        <li>
          <span class="name">Balance Ally</span>
          <span class="zeit">4 days ago</span>
          <span class="status pausiert"><i></i>Paused</span>
        </li>
      </ul>
      <div class="feld">
        <input type="text" readonly placeholder="Search...">
        <span class="mass">Column 1–9</span>
      </div>
      <div class="aktionen">
        <button type="button" class="primaer">New project</button>
        <button type="button" class="sekundaer">Import</button>
      </div>
      <div class="fuss">
        <span class="balken"></span>
        <span>Asymmetric type axis · separation by rule and spacing alone</span>
      </div>
    </div>
  </div>
</div>
