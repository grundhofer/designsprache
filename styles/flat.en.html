<style>
.style-flat,
.style-flat *,
.style-flat *::before,
.style-flat *::after { box-sizing: border-box; }

.style-flat {
  --flat-blue: #0A6CA8;
  --flat-blue-hi: #0D82C9;
  --flat-teal: #0E7A5F;
  --flat-grey: #5B5B5B;
  --flat-red: #B81100;
  --flat-amber: #C25E00;
  --flat-ink: #141414;
  --flat-ink-soft: #6E6E6E;
  --flat-hair: #E2E2E2;

  width: 100%;
  padding: 0;
  color: var(--flat-ink);
  background: #FFFFFF;
  font-family: "Work Sans", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  font-weight: 400;
  color-scheme: light;
}

.style-flat .demo {
  min-height: 460px;
  display: flex;
  flex-direction: column;
  background: #FFFFFF;
}

/* --- Metro-Zierbalken: vier Farbsegmente, 0 Radius, 0 Schatten --- */
.style-flat .stripe {
  display: flex;
  height: 6px;
  flex: none;
}
.style-flat .stripe i { flex: 1; }
.style-flat .stripe i:nth-child(1) { background: var(--flat-blue); }
.style-flat .stripe i:nth-child(2) { background: var(--flat-teal); }
.style-flat .stripe i:nth-child(3) { background: var(--flat-amber); }
.style-flat .stripe i:nth-child(4) { background: var(--flat-red); }

/* --- Kopf: sehr grosse duenne Grotesk, Zaehler als Vollflaeche --- */
.style-flat .head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 28px 24px 22px;
}

.style-flat .title {
  margin: 0;
  font-size: 52px;
  font-weight: 200;
  letter-spacing: -0.035em;
  line-height: 0.94;
  color: var(--flat-ink);
}

.style-flat .count {
  flex: none;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--flat-red);
  color: #FFFFFF;
  font-size: 30px;
  font-weight: 300;
  letter-spacing: -0.02em;
}

/* --- Liste als Kachelstapel: Vollflaechenfarbe traegt die Bedeutung --- */
.style-flat .tiles {
  list-style: none;
  margin: 0;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.style-flat .tile {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  color: #FFFFFF;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.style-flat .tile-blue { background: var(--flat-blue); }
.style-flat .tile-teal { background: var(--flat-teal); }
.style-flat .tile-grey { background: var(--flat-grey); }

.style-flat .glyph {
  flex: none;
  width: 26px;
  height: 26px;
  display: block;
}
.style-flat .glyph circle,
.style-flat .glyph path,
.style-flat .glyph rect,
.style-flat .glyph line {
  fill: none;
  stroke: #FFFFFF;
  stroke-width: 1.5;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.style-flat .meta { flex: 1; min-width: 0; }

.style-flat .name {
  display: block;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.style-flat .time {
  display: block;
  margin-top: 1px;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.92);
}

.style-flat .status {
  flex: none;
  padding: 4px 10px 3px;
  border: 2px solid rgba(255,255,255,.85);
  border-radius: 0;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #FFFFFF;
}

/* --- Naht zwischen Flat 1.0 (oben) und Flat 2.0 (unten) --- */
.style-flat .seam {
  margin: 26px 24px 0;
  height: 1px;
  background: var(--flat-hair);
  flex: none;
}

/* --- Flat 2.0: eine Schattenstufe, 1px Border, kleiner Radius --- */
.style-flat .panel {
  margin: 22px 24px 26px;
  padding: 16px;
  background: #FFFFFF;
  border: 1px solid var(--flat-hair);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.10);
}

.style-flat .field {
  position: relative;
  margin-bottom: 14px;
}

.style-flat .field .lens {
  position: absolute;
  left: 12px;
  top: 50%;
  width: 15px;
  height: 15px;
  margin-top: -7.5px;
  pointer-events: none;
}
.style-flat .field .lens circle,
.style-flat .field .lens line {
  fill: none;
  stroke: #9A9A9A;
  stroke-width: 1.5;
  stroke-linecap: square;
}

.style-flat input {
  width: 100%;
  height: 40px;
  padding: 0 12px 0 34px;
  font: inherit;
  font-size: 15px;
  color: var(--flat-ink);
  background: #FFFFFF;
  border: 1px solid #CFCFCF;
  border-radius: 4px;
  outline: none;
}
.style-flat input::placeholder { color: #8C8C8C; }
.style-flat input:focus {
  border-color: var(--flat-blue);
  box-shadow: 0 0 0 3px rgba(10,108,168,.22);
}

.style-flat .actions {
  display: flex;
  gap: 10px;
}

.style-flat button {
  flex: 1;
  height: 42px;
  padding: 0 18px;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color .12s linear, border-color .12s linear;
}

.style-flat .btn-primary {
  color: #FFFFFF;
  background: var(--flat-blue);
  border: 1px solid var(--flat-blue);
  box-shadow: 0 1px 2px rgba(10,108,168,.28);
}
.style-flat .btn-primary:hover  { background: var(--flat-blue-hi); border-color: var(--flat-blue-hi); }
.style-flat .btn-primary:active { background: #08587F; border-color: #08587F; box-shadow: none; }

.style-flat .btn-secondary {
  color: var(--flat-ink);
  background: #FFFFFF;
  border: 1px solid #CFCFCF;
}
.style-flat .btn-secondary:hover  { background: #F5F5F5; border-color: #B8B8B8; }
.style-flat .btn-secondary:active { background: #ECECEC; }

.style-flat button:focus-visible,
.style-flat input:focus-visible {
  outline: 2px solid var(--flat-ink);
  outline-offset: 2px;
}
</style>
<div class="style-flat">
  <div class="demo">

    <div class="stripe"><i></i><i></i><i></i><i></i></div>

    <div class="head">
      <h2 class="title">Projects</h2>
      <div class="count">12</div>
    </div>

    <ul class="tiles">
      <li class="tile tile-blue">
        <svg class="glyph" viewBox="0 0 26 26" aria-hidden="true">
          <circle cx="13" cy="13" r="10"></circle>
          <line x1="13" y1="3" x2="13" y2="23"></line>
          <line x1="3" y1="13" x2="23" y2="13"></line>
        </svg>
        <span class="meta">
          <span class="name">Nexus</span>
          <span class="time">2 hrs ago</span>
        </span>
        <span class="status">Active</span>
      </li>
      <li class="tile tile-teal">
        <svg class="glyph" viewBox="0 0 26 26" aria-hidden="true">
          <path d="M4 22 L6 16 L18 4 L22 8 L10 20 Z"></path>
          <line x1="16" y1="6" x2="20" y2="10"></line>
        </svg>
        <span class="meta">
          <span class="name">Autowrite Studio</span>
          <span class="time">yesterday</span>
        </span>
        <span class="status">Active</span>
      </li>
      <li class="tile tile-grey">
        <svg class="glyph" viewBox="0 0 26 26" aria-hidden="true">
          <path d="M13 3 L23 21 L3 21 Z"></path>
          <line x1="7" y1="15" x2="19" y2="15"></line>
        </svg>
        <span class="meta">
          <span class="name">Balance Ally</span>
          <span class="time">4 days ago</span>
        </span>
        <span class="status">Paused</span>
      </li>
    </ul>

    <div class="seam"></div>

    <div class="panel">
      <div class="field">
        <svg class="lens" viewBox="0 0 15 15" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="4.75"></circle>
          <line x1="10" y1="10" x2="14" y2="14"></line>
        </svg>
        <input type="text" readonly placeholder="Search...">
      </div>
      <div class="actions">
        <button type="button" class="btn-primary">New project</button>
        <button type="button" class="btn-secondary">Import</button>
      </div>
    </div>

  </div>
</div>
